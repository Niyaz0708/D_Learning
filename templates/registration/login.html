{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}Login - D Learning{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <i class="bi bi-mortarboard-fill text-primary display-4"></i>
                    <h2 class="mt-3 mb-1">Welcome Back</h2>
                    <p class="text-muted">Sign in to continue learning</p>
                </div>

                <form method="post" novalidate>
                    {% csrf_token %}
                    {{ form|crispy }}
                    
                    <div class="d-grid gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                        </button>
                    </div>
                </form>

                <div class="text-center mt-4">
                    <p class="text-muted mb-0">Don't have an account?</p>
                    <a href="{% url 'register' %}" class="text-primary">Create an account</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
